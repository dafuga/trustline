# No account_id on purpose: pass CLOUDFLARE_ACCOUNT_ID at deploy time.
# Public test relay: wss://trustline-relay.danielfugere28.workers.dev
name = "trustline-relay"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

[durable_objects]
bindings = [
  { name = "MAILBOX", class_name = "Mailbox" },
  { name = "ROOM", class_name = "PairingRoom" },
  { name = "RATE_GATE", class_name = "RateGate" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Mailbox", "PairingRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateGate"]
