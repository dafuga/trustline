# No account_id on purpose. This Worker has not been deployed.
# Once it is, clients use wss://trustline-relay.<account>.workers.dev.
name = "trustline-relay"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

[durable_objects]
bindings = [
  { name = "MAILBOX", class_name = "Mailbox" },
  { name = "ROOM", class_name = "PairingRoom" },
  { name = "RATE_GATE", class_name = "RateGate" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Mailbox", "PairingRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateGate"]
